      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: jobID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CheckID:
      name: checkID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PreviewID:
      name: previewID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LookupStatus:
