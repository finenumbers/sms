          type: string
          format: uuid
        type:
          type: string
          enum: [hlr, ping]
        status:
          type: string
          enum: [queued, reserved, pending, completed, failed]
        phone:
          type: string
        result_status:
          type: string
          enum: [reachable, unreachable, pending, error, unknown]
