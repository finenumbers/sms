          nullable: true
        error_message:
          type: string
          nullable: true
        unit_sell_price:
          type: string
          description: Cabinet/public sell price only; no provider cost
        actual_cost:
          type: string
          description: Captured sell share written by settle, not SMSC provider cost. Empty after RELEASE.
        currency:
          type: string
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    CreateWebhookRequest:
