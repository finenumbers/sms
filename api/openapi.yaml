        "401":
          description: Missing or invalid signature
  /internal/runexis/{kind}/{token}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [dlr, mo]
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [ingress]
      operationId: ingressCaptureGet
      description: Persist query as payload, then 200. Wrong token → 404.
      responses:
        "200":
          description: Stored (or duplicate)
        "404":
          description: Unknown kind or token
    post:
      tags: [ingress]
      operationId: ingressCapturePost
      description: Persist raw body, then 200. Wrong token → 404.
      responses:
        "200":
          description: Stored (or duplicate)
        "404":
          description: Unknown kind or token
    put:
      tags: [ingress]
      operationId: ingressCapturePut
      description: Persist raw body, then 200. Wrong token → 404.
      responses:
        "200":
          description: Stored (or duplicate)
        "404":
          description: Unknown kind or token
components:
