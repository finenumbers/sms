# Portainer stack: one file, no published ports, no Caddy.
# NPM on the existing Docker network `proxy` terminates TLS and forwards
# three Proxy Hosts to finenumbers-api:8080 (do not rewrite Host).
#
# Required Portainer env (nothing else):
#   APP_MASTER_KEY, POSTGRES_PASSWORD,
#   ADMIN_HOST, CLIENT_HOST, API_HOST (public FQDNs, no port, no www)
#
# Optional first boot only: SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD — remove after login.
# Image defaults to ghcr.io/finenumbers/sms:latest (last GitHub Release). Redeploy pulls it.
# Runexis / SMSC credentials: Admin → Settings, never stack env. No SMSC_* fields.
#
# Confirm the NPM network is actually named `proxy` before deploying.

name: finenumbers

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-sms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sms} -d ${POSTGRES_DB:-sms}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${FINENUMBERS_IMAGE:-ghcr.io/finenumbers/sms:latest}
    pull_policy: always
    command: ["migrate"]
    environment:
      APP_MODE: migrate
      DATABASE_URL: postgres://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sms}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${FINENUMBERS_IMAGE:-ghcr.io/finenumbers/sms:latest}
    pull_policy: always
    command: ["api"]
    container_name: finenumbers-api
    restart: unless-stopped
    environment:
      APP_MODE: api
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sms}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY required}
      APP_MASTER_KEY_PREVIOUS: ${APP_MASTER_KEY_PREVIOUS:-}
      RUNEXIS_BASE_URL: ${RUNEXIS_BASE_URL:-https://didapi.runexis.ru}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrator}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_HOST: ${ADMIN_HOST:?ADMIN_HOST required}
      CLIENT_HOST: ${CLIENT_HOST:?CLIENT_HOST required}
      API_HOST: ${API_HOST:?API_HOST required}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      ADMIN_SPA_DIR: /srv/admin
      CLIENT_SPA_DIR: /srv/client
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - default
      - proxy

  worker:
    image: ${FINENUMBERS_IMAGE:-ghcr.io/finenumbers/sms:latest}
    pull_policy: always
    command: ["worker"]
    restart: unless-stopped
    environment:
      APP_MODE: worker
      DATABASE_URL: postgres://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sms}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY required}
      APP_MASTER_KEY_PREVIOUS: ${APP_MASTER_KEY_PREVIOUS:-}
      RUNEXIS_BASE_URL: ${RUNEXIS_BASE_URL:-https://didapi.runexis.ru}
      METRICS_ADDR: ":9091"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sms}?sslmode=disable
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${DATABASE_URL:?DATABASE_URL is required}"
        BACKUP_DIR="$${BACKUP_DIR:-/backups}"
        BACKUP_KEEP_DAYS="$${BACKUP_KEEP_DAYS:-7}"
        BACKUP_INTERVAL_SECONDS="$${BACKUP_INTERVAL_SECONDS:-86400}"
        mkdir -p "$$BACKUP_DIR"
        while true; do
          ts="$$(date -u +%Y%m%dT%H%M%SZ)"
          file="$$BACKUP_DIR/sms-$$ts.sql.gz"
          echo "pg_dump $$file"
          pg_dump --no-owner --no-acl "$$DATABASE_URL" | gzip -c > "$$file.tmp"
          mv "$$file.tmp" "$$file"
          find "$$BACKUP_DIR" -name 'sms-*.sql.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete || true
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

networks:
  proxy:
    external: true
    name: proxy

volumes:
  postgres_data:
  postgres_backups:
