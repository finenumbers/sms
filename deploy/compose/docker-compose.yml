name: finenumbers

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sms}
      POSTGRES_DB: ${POSTGRES_DB:-sms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sms} -d ${POSTGRES_DB:-sms}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      APP_MODE: migrate
      DATABASE_URL: postgres://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD:-sms}@postgres:5432/${POSTGRES_DB:-sms}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["api"]
    environment:
      APP_MODE: api
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD:-sms}@postgres:5432/${POSTGRES_DB:-sms}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      APP_MASTER_KEY: ${APP_MASTER_KEY}
      APP_MASTER_KEY_PREVIOUS: ${APP_MASTER_KEY_PREVIOUS:-}
      RUNEXIS_BASE_URL: ${RUNEXIS_BASE_URL:-https://didapi.runexis.ru}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrator}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_HOST: ${ADMIN_HOST:-admin.sms.localhost}
      CLIENT_HOST: ${CLIENT_HOST:-client.sms.localhost}
      API_HOST: ${API_HOST:-api.sms.localhost}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      ADMIN_SPA_DIR: /srv/admin
      CLIENT_SPA_DIR: /srv/client
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["worker"]
    environment:
      APP_MODE: worker
      DATABASE_URL: postgres://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD:-sms}@postgres:5432/${POSTGRES_DB:-sms}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      APP_MASTER_KEY: ${APP_MASTER_KEY}
      APP_MASTER_KEY_PREVIOUS: ${APP_MASTER_KEY_PREVIOUS:-}
      RUNEXIS_BASE_URL: ${RUNEXIS_BASE_URL:-https://didapi.runexis.ru}
      METRICS_ADDR: ":9091"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  backup:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.backup
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD:-sms}@postgres:5432/${POSTGRES_DB:-sms}?sslmode=disable
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - worker

volumes:
  postgres_data:
  postgres_backups:
